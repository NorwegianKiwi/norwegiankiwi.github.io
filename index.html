<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The personal homepage of Lance Olav Eastgate.">
  <link rel="stylesheet" href="nav.css">
  <link rel="stylesheet" href="index.css">
  <title>Lance Olav Eastgate</title>
</head>
<body>
  <div class="page-shell">
    <nav class="site-nav" aria-label="Main navigation">
      <div class="nav-inner">
        <a class="nav-symbol" href="index.html" aria-label="Home" aria-current="page">
          <span class="home-mark" aria-hidden="true"></span>
        </a>
        <a class="nav-symbol" href="contents.html" aria-label="Contents">
          <span class="contents-mark" aria-hidden="true"></span>
        </a>
      </div>
    </nav>
    <main class="quiet-field">
      <h1 class="sr-only">Explore lanceolav.com</h1>

      <div class="orbit-stage">
        <div class="asteroid-belt" aria-hidden="true"></div>
        <div class="central-light" aria-hidden="true"></div>

        <div class="orbit-track orbit-cv">
          <a class="discovery" href="cv_english.html" aria-label="Curriculum vitae">
            <span class="discovery-orientation">
              <img class="discovery-mark portrait-mark" src="portrait_wedding.png" alt="">
            </span>
          </a>
        </div>

        <div class="orbit-track orbit-geography">
          <a class="discovery" href="helloworld/" aria-label="Hello World! geography game">
            <span class="discovery-orientation">
              <img class="discovery-mark globe-mark" src="helloworld/favicon.svg" alt="">
            </span>
          </a>
        </div>

        <div class="orbit-track orbit-brainteaser">
          <a class="discovery" href="brainteaser.html" aria-label="Brain Teaser">
            <span class="discovery-orientation">
              <span class="discovery-mark puzzle-fragment" aria-hidden="true">
                <span>2974</span>
                <span>6666</span>
                <span>2125</span>
              </span>
            </span>
          </a>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
