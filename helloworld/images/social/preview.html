<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Social preview composition</title>
    <link rel="stylesheet" href="../../styles/base.css" />
    <link rel="stylesheet" href="../../styles/quiz.css" />
    <link rel="stylesheet" href="preview.css" />
    <script src="../../countries.js" defer></script>
    <script src="../../curriculum.js" defer></script>
    <script src="../../world-map.js" defer></script>
    <script src="../../map-view.js" defer></script>
    <script src="preview.js" defer></script>
  </head>
  <body>
    <main class="social-preview">
      <header class="social-header">
        <span class="brand">Hello World!</span>
        <div class="question-prompt"><h1>Which place?</h1></div>
      </header>
      <div class="social-game">
        <div class="map-quiz-visual">
          <svg class="question-map" role="img" aria-label="Nearby map with Italy highlighted"></svg>
        </div>
        <div class="social-answers" aria-label="Answer choices"></div>
      </div>
    </main>
  </body>
</html>
